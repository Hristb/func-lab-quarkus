name: Build and Deploy Quarkus Azure Function - DEV

on:
  push:
    branches:
      - develop

  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
  JAVA_VERSION: "17"
  POM_XML_DIRECTORY: .
  BUILD_ARTIFACT_NAME: released-package

jobs:

  build:
    name: Build and Test
    runs-on: windows-latest

    permissions:
      contents: read

    defaults:
      run:
        shell: bash
        working-directory: ${{ env.POM_XML_DIRECTORY }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: microsoft
          cache: maven

      - name: Build Quarkus project
        run: mvn clean package -DfunctionAppName=${{ env.AZURE_FUNCTIONAPP_NAME }}

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}
          path: ${{ env.POM_XML_DIRECTORY }}/target/azure-functions/${{ env.AZURE_FUNCTIONAPP_NAME }}

  deploy:
    name: Deploy to Azure DEV
    runs-on: windows-latest

    needs: build

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Download deployment artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.BUILD_ARTIFACT_NAME }}
          path: ${{ env.POM_XML_DIRECTORY }}/downloaded-artifact

      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.POM_XML_DIRECTORY }}/downloaded-artifact
          respect-pom-xml: false